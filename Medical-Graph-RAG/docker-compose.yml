services:
  neo4j:
    image: neo4j:5.26-community
    container_name: medgraph-neo4j
    entrypoint:
      - bash
      - -c
      - |
        cp /var/lib/neo4j/labs/apoc-*-core.jar /var/lib/neo4j/plugins/apoc.jar 2>/dev/null
        cp /custom-conf/neo4j.conf /var/lib/neo4j/conf/neo4j.conf
        exec /startup/docker-entrypoint.sh neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4j123!}
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_directories_logs=/logs
    volumes:
      - ./neo4j-data/data:/data
      - ./neo4j-data/logs:/logs
      - ./neo4j-data/import:/var/lib/neo4j/import
      - ./neo4j-data/conf/neo4j.conf:/custom-conf/neo4j.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-neo4j123!}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: medgraph-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy
    command: conda run -n medgraphrag uvicorn backend.app:app --host 0.0.0.0 --port 8000
